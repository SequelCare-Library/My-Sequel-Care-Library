<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ספריית תכנים | SequelCare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Heebo:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#153e7b;
    --navy-dark:#0d2a57;
    --navy-light:#e8edf7;
    --orange:#ff9441;
    --orange-dark:#e87d28;
    --teal:#00ccc1;
    --teal-dark:#00a89e;
    --bg:#f5f7fb;
    --card:#ffffff;
    --text:#1c2b45;
    --muted:#6b7a94;
    --radius:18px;
    --shadow: 0 6px 24px rgba(21,62,123,0.10);
    --shadow-hover: 0 14px 32px rgba(21,62,123,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Heebo', sans-serif;
    background:
      radial-gradient(circle at 108% -6%, rgba(0,204,193,0.22), transparent 42%),
      radial-gradient(circle at -8% 18%, rgba(255,148,65,0.16), transparent 38%),
      radial-gradient(circle at 50% 115%, rgba(21,62,123,0.14), transparent 45%),
      linear-gradient(180deg, #eef2fa 0%, #e7ecf7 45%, #eef1f8 100%);
    background-attachment:fixed;
    color:var(--text);
    min-height:100vh;
  }
  .topbar{
    background:linear-gradient(120deg, var(--navy) 0%, var(--navy-dark) 100%);
    padding:20px 32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 10px 30px rgba(9,25,54,0.45), 0 2px 0 rgba(255,255,255,0.06) inset;
    position:sticky;
    top:0;
    z-index:50;
    border-bottom:1px solid rgba(0,204,193,0.25);
  }
  .topbar::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(circle at 15% 0%, rgba(0,204,193,0.35), transparent 55%),
               radial-gradient(circle at 90% 120%, rgba(255,148,65,0.28), transparent 50%);
  }
  .topbar > *{position:relative; z-index:1;}
  .brand{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .brand-logo{
    height:34px;
    display:block;
    background:#fff;
    padding:6px 10px;
    border-radius:10px;
  }
  .back-btn{
    display:none;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.25);
    color:#fff;
    padding:9px 18px;
    border-radius:100px;
    cursor:pointer;
    font-family:'Heebo',sans-serif;
    font-size:14.5px;
    transition:.2s;
  }
  .back-btn:hover{background:rgba(255,255,255,0.22);}
  .back-btn svg{width:16px;height:16px;}

  main{
    max-width:1180px;
    margin:0 auto;
    padding:38px 28px 80px;
  }

  /* ---------- HOME VIEW ---------- */
  .hero{
    text-align:center;
    margin-bottom:38px;
    position:relative;
  }
  .hero::before{
    content:"";
    position:absolute;
    top:-60px; left:50%;
    transform:translateX(-50%);
    width:480px; height:220px;
    background:radial-gradient(ellipse at center, rgba(21,62,123,0.14), transparent 70%);
    z-index:-1;
  }
  .hero h2{
    font-family:'Rubik',sans-serif;
    font-size:32px;
    font-weight:800;
    color:var(--navy-dark);
    margin:0 0 10px;
    text-shadow:0 2px 0 rgba(255,255,255,0.6);
  }
  .hero p{
    color:var(--muted);
    font-size:15.5px;
    max-width:560px;
    margin:0 auto;
  }

  .intro-tile{
    background:linear-gradient(155deg, #ffab5c 0%, var(--orange-dark) 65%, #d9660f 100%);
    color:#fff;
    border:1px solid rgba(255,255,255,0.25);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.35) inset,
      0 14px 30px -10px rgba(200,90,10,0.55),
      0 3px 8px rgba(200,90,10,0.3);
  }
  .intro-tile::before{background:linear-gradient(90deg, var(--navy-dark), var(--navy));}
  .intro-tile:hover{
    border-color:rgba(255,255,255,0.4);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.35) inset,
      0 22px 40px -12px rgba(200,90,10,0.6),
      0 6px 14px rgba(200,90,10,0.3);
  }
  .intro-tile .icon-wrap{
    background:linear-gradient(150deg, rgba(255,255,255,0.32), rgba(255,255,255,0.08));
    box-shadow:
      inset 0 1px 2px rgba(255,255,255,0.55),
      inset 0 -6px 10px rgba(0,0,0,0.12),
      0 10px 20px -6px rgba(0,0,0,0.3);
  }
  .intro-tile .eyebrow{
    display:inline-block;
    font-size:11.5px;
    color:var(--navy-dark);
    background:#fff;
    padding:3px 10px;
    border-radius:100px;
    font-weight:800;
    letter-spacing:.3px;
    margin-bottom:10px;
  }
  .intro-tile h3{color:#fff;}
  .intro-tile .corner-dot{background:#fff; box-shadow:0 0 0 4px rgba(255,255,255,0.25), 0 2px 6px rgba(0,0,0,0.2);}

  .domains-label{
    font-family:'Rubik',sans-serif;
    font-size:14px;
    font-weight:700;
    color:var(--navy);
    margin:0 0 16px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .domains-label::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(to left, rgba(21,62,123,0.18), transparent);
  }

  .domain-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:20px;
  }
  @media (max-width:900px){ .domain-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:600px){ .domain-grid{grid-template-columns:1fr;} }

  .domain-card{
    background:linear-gradient(160deg, #ffffff 0%, #fbfcff 100%);
    border-radius:var(--radius);
    padding:26px 22px 24px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.8) inset,
      0 14px 30px -10px rgba(21,62,123,0.28),
      0 3px 8px rgba(21,62,123,0.10);
    cursor:pointer;
    transition:.28s cubic-bezier(.2,.7,.3,1);
    border:1px solid rgba(21,62,123,0.08);
    position:relative;
    overflow:hidden;
  }
  .domain-card::before{
    content:"";
    position:absolute;
    top:0; right:0; left:0;
    height:5px;
    background:linear-gradient(90deg, var(--orange), var(--teal));
    opacity:.85;
  }
  .domain-card:hover{
    box-shadow:
      0 1px 0 rgba(255,255,255,0.8) inset,
      0 22px 40px -12px rgba(21,62,123,0.38),
      0 6px 14px rgba(0,204,193,0.18);
    transform:translateY(-6px);
    border-color:rgba(0,204,193,0.4);
  }
  .domain-card .icon-wrap{
    width:58px;height:58px;
    border-radius:17px;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:18px;
    background:linear-gradient(150deg, #2456a3 0%, var(--navy) 55%, var(--navy-dark) 100%);
    box-shadow:
      inset 0 1px 2px rgba(255,255,255,0.4),
      inset 0 -6px 10px rgba(0,0,0,0.18),
      0 10px 20px -6px rgba(21,62,123,0.55);
    position:relative;
  }
  .domain-card .icon-wrap::after{
    content:"";
    position:absolute; inset:0;
    border-radius:inherit;
    background:radial-gradient(circle at 30% 20%, rgba(255,255,255,0.35), transparent 55%);
  }
  .domain-card .icon-wrap svg{width:34px;height:34px;filter:drop-shadow(0 3px 3px rgba(0,0,0,0.25));position:relative;z-index:1;}
  .domain-card h3{
    font-family:'Rubik',sans-serif;
    font-size:16.5px;
    font-weight:700;
    margin:0 0 6px;
    color:var(--text);
    line-height:1.35;
  }
  .domain-card .count{
    font-size:13px;
    color:var(--muted);
  }
  .domain-card .count b{color:var(--orange-dark);}
  .domain-card .corner-dot{
    position:absolute; top:22px; left:18px;
    width:9px;height:9px;border-radius:50%;
    background:var(--teal);
    box-shadow:0 0 0 4px rgba(0,204,193,0.18), 0 2px 6px rgba(0,204,193,0.5);
  }

  /* ---------- UNITS VIEW ---------- */
  .view{display:none;}
  .view.active{display:block;}

  .domain-header{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:28px;
  }
  .domain-header .icon-wrap{
    width:62px;height:62px;flex:none;
    border-radius:18px;
    background:linear-gradient(145deg, #1c4a91, var(--navy-dark));
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 1px 1px rgba(255,255,255,0.25), 0 8px 18px rgba(21,62,123,0.35);
  }
  .domain-header .icon-wrap svg{width:34px;height:34px;filter:drop-shadow(0 2px 2px rgba(0,0,0,0.18));}
  .domain-header h2{
    font-family:'Rubik',sans-serif;
    font-size:25px;
    font-weight:800;
    margin:0 0 4px;
    color:var(--navy-dark);
  }
  .domain-header p{margin:0;color:var(--muted);font-size:14px;}

  .unit-list{display:flex;flex-direction:column;gap:14px;}
  .unit-row{
    background:linear-gradient(160deg, #ffffff 0%, #fbfcff 100%);
    border-radius:16px;
    padding:18px 22px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.8) inset,
      0 10px 22px -8px rgba(21,62,123,0.22),
      0 2px 6px rgba(21,62,123,0.08);
    display:flex;
    align-items:center;
    gap:18px;
    border-right:5px solid var(--teal);
    border-top:1px solid rgba(21,62,123,0.06);
    border-bottom:1px solid rgba(21,62,123,0.06);
    border-left:1px solid rgba(21,62,123,0.06);
    transition:.22s;
  }
  .unit-row:hover{
    box-shadow:
      0 1px 0 rgba(255,255,255,0.8) inset,
      0 16px 30px -10px rgba(21,62,123,0.3),
      0 4px 10px rgba(0,204,193,0.12);
    transform:translateY(-2px);
  }
  .unit-index{
    font-family:'Rubik',sans-serif;
    font-weight:800;
    font-size:15px;
    color:#fff;
    background:linear-gradient(150deg, #ffb46b, var(--orange-dark));
    width:34px;height:34px;flex:none;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 10px -2px rgba(232,125,40,0.55), inset 0 1px 1px rgba(255,255,255,0.4);
  }
  .unit-name{
    flex:1;
    font-weight:600;
    font-size:15.5px;
    color:var(--text);
  }
  .unit-actions{display:flex;gap:10px;flex:none;}
  .btn{
    border:none;
    border-radius:100px;
    padding:9px 16px;
    font-family:'Heebo',sans-serif;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    display:flex;align-items:center;gap:6px;
    transition:.2s;
    white-space:nowrap;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn svg{width:15px;height:15px;}

  @media (max-width:560px){
    .unit-row{
      flex-direction:column;
      align-items:stretch;
      padding:16px 18px;
      gap:12px;
    }
    .unit-row .unit-index{align-self:flex-start;}
    .unit-name{font-size:15px;}
    .unit-actions{width:100%;}
    .unit-actions .btn{flex:1 1 0;justify-content:center;padding:10px 12px;}
    .domain-header{gap:12px;}
    .domain-header h2{font-size:21px;}
  }
  .btn-explain{
    background:linear-gradient(150deg, #eef3fc, var(--navy-light));
    color:var(--navy);
    box-shadow:inset 0 0 0 1px rgba(21,62,123,0.12), 0 2px 6px rgba(21,62,123,0.08);
  }
  .btn-explain:hover{background:#d9e3f5; box-shadow:inset 0 0 0 1px rgba(21,62,123,0.18), 0 6px 14px rgba(21,62,123,0.18);}
  .btn-comps{
    background:linear-gradient(150deg, #ffb46b, var(--orange-dark));
    color:#fff;
    box-shadow:0 4px 12px -2px rgba(232,125,40,0.5), inset 0 1px 1px rgba(255,255,255,0.35);
  }
  .btn-comps:hover{box-shadow:0 8px 18px -2px rgba(232,125,40,0.6), inset 0 1px 1px rgba(255,255,255,0.35);}

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(13,25,50,0.55);
    backdrop-filter:blur(3px);
    display:none;
    align-items:center;justify-content:center;
    z-index:100;
    padding:20px;
  }
  .overlay.active{display:flex;}
  .modal{
    background:#fff;
    border-radius:20px;
    max-width:560px;
    width:100%;
    max-height:80vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 24px 70px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.1);
    animation:pop .22s ease;
  }
  @keyframes pop{from{transform:scale(.94);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal-head{
    padding:22px 26px;
    background:linear-gradient(120deg, var(--navy), var(--navy-dark));
    color:#fff;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    position:relative;
    overflow:hidden;
  }
  .modal-head::after{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(circle at 90% -20%, rgba(255,148,65,0.35), transparent 55%);
    pointer-events:none;
  }
  .modal-head > *{position:relative; z-index:1;}
  .modal-head .tag{
    font-size:11.5px;
    color:var(--teal);
    font-weight:700;
    letter-spacing:.4px;
    margin-bottom:6px;
  }
  .modal-head h3{
    font-family:'Rubik',sans-serif;
    margin:0;
    font-size:18px;
    line-height:1.4;
  }
  .modal-close{
    background:rgba(255,255,255,0.15);
    border:none;
    color:#fff;
    width:30px;height:30px;
    border-radius:50%;
    cursor:pointer;
    flex:none;
    font-size:16px;
    line-height:1;
  }
  .modal-close:hover{background:rgba(255,255,255,0.28);}
  .modal-body{
    padding:24px 26px;
    overflow-y:auto;
    font-size:15px;
    line-height:1.75;
    color:var(--text);
  }
  .comps-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .comps-list li{
    background:var(--bg);
    border-radius:12px;
    padding:12px 14px;
    font-size:14.5px;
  }
  .comps-list li.section{
    background:linear-gradient(120deg, var(--navy), var(--navy-dark));
    color:#fff;
    font-family:'Rubik',sans-serif;
    font-weight:700;
    font-size:13.5px;
    letter-spacing:.3px;
    padding:10px 16px;
    margin-top:6px;
  }
  .comps-list li.section:first-child{margin-top:0;}
</style>
</head>

      <linearGradient id="g5b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb46b"/><stop offset="1" stop-color="#ff8a2e"/></linearGradient>
    </defs>
    <circle cx="24" cy="24" r="21" fill="#2a5aa6" opacity="0.35"/>
    <path d="M17 16h14a2 2 0 0 1 2 2v2H15v-2a2 2 0 0 1 2-2z" fill="#2a5aa6"/>
    <rect x="9" y="19" width="30" height="17" rx="3" fill="url(#g5a)"/>
    <rect x="20" y="24" width="8" height="6" rx="1.3" fill="url(#g5b)"/>
  </svg>`,
  "שילוב והשתתפות בקהילה": `<svg viewBox="0 0 48 48">
    <defs>
      <linearGradient id="g6a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe9fb"/></linearGradient>
      <linearGradient id="g6b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb46b"/><stop offset="1" stop-color="#ff8a2e"/></linearGradient>
    </defs>
    <circle cx="24" cy="24" r="21" fill="#2a5aa6" opacity="0.35"/>
    <circle cx="17" cy="18" r="5" fill="url(#g6a)"/>
    <path d="M8 37c0-5.5 4-9 9-9s9 3.5 9 9" fill="url(#g6a)"/>
    <circle cx="32" cy="20" r="4" fill="url(#g6b)"/>
    <path d="M25 37c.4-4.6 3.4-7.6 7.5-7.6s7 3 7.5 7.6" fill="url(#g6b)"/>
  </svg>`,
};
const GENERIC_ICON = `<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="#2a5aa6" opacity="0.35"/><circle cx="24" cy="24" r="10" fill="#ffffff"/></svg>`;

const introUnit = RAW_DATA.find(d => d.domain.includes('כללי'));
const domains = RAW_DATA.filter(d => !d.domain.includes('כללי'));

const domainGrid = document.getElementById('domainGrid');
const introCard = document.createElement('div');
introCard.className = 'domain-card intro-tile';
introCard.innerHTML = `
  <div class="corner-dot"></div>
  <div class="icon-wrap">${ICONS['__intro__']}</div>
  <div class="eyebrow">יחידת פתיחה</div>
  <h3>${introUnit.units[0].name}</h3>
`;
introCard.addEventListener('click', () => openDomain(-1));
domainGrid.appendChild(introCard);

domains.forEach((d, idx) => {
  const card = document.createElement('div');
  card.className = 'domain-card';
  card.innerHTML = `
    <div class="corner-dot"></div>
    <div class="icon-wrap">${ICONS[d.domain] || GENERIC_ICON}</div>
    <h3>${d.domain}</h3>
    <div class="count"><b>${d.units.length}</b> יחידות</div>
  `;
  card.addEventListener('click', () => openDomain(idx));
  domainGrid.appendChild(card);
});

const homeView = document.getElementById('homeView');
const unitsView = document.getElementById('unitsView');
const backBtn = document.getElementById('backBtn');
const unitList = document.getElementById('unitList');
const unitsTitle = document.getElementById('unitsTitle');
const unitsSubtitle = document.getElementById('unitsSubtitle');
const unitsIcon = document.getElementById('unitsIcon');

function openDomain(idx){
  let d;
  const isIntro = idx === -1;
  if(isIntro){
    d = introUnit;
    unitsIcon.innerHTML = ICONS['__intro__'];
  } else {
    d = domains[idx];
    unitsIcon.innerHTML = ICONS[d.domain] || GENERIC_ICON;
  }
  unitsTitle.textContent = isIntro ? d.units[0].name : d.domain;
  unitsSubtitle.textContent = isIntro
    ? 'יחידת פתיחה'
    : (d.units.length === 1 ? 'יחידה אחת בתחום זה' : d.units.length + ' יחידות תוכן בתחום זה');
  unitList.innerHTML = '';
  d.units.forEach((u, i) => {
    const row = document.createElement('div');
    row.className = 'unit-row';
    row.innerHTML = `
      ${isIntro ? '' : `<div class="unit-index">${i+1}</div>`}
      <div class="unit-name">${u.name}</div>
      <div class="unit-actions">
        <button class="btn btn-explain">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          הסבר
        </button>
        <button class="btn btn-comps">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
          רכיבי היחידה
        </button>
      </div>
    `;
    row.querySelector('.btn-explain').addEventListener('click', () => openModal('explain', d.domain, u));
    row.querySelector('.btn-comps').addEventListener('click', () => openModal('comps', d.domain, u));
    unitList.appendChild(row);
  });
  homeView.classList.remove('active');
  unitsView.classList.add('active');
  backBtn.style.display = 'flex';
  window.scrollTo({top:0, behavior:'smooth'});
}

backBtn.addEventListener('click', () => {
  unitsView.classList.remove('active');
  homeView.classList.add('active');
  backBtn.style.display = 'none';
  window.scrollTo({top:0, behavior:'smooth'});
});

const overlay = document.getElementById('overlay');
const modalTag = document.getElementById('modalTag');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');

function openModal(type, domainName, unit){
  if(type === 'explain'){
    modalTag.textContent = domainName + ' · הסבר על היחידה';
    modalTitle.textContent = unit.name;
    modalBody.innerHTML = `<p>${unit.explain || 'אין הסבר זמין ליחידה זו.'}</p>`;
  } else {
    modalTag.textContent = domainName + ' · רכיבי היחידה';
    modalTitle.textContent = unit.name;
    if(unit.comps && unit.comps.length){
      modalBody.innerHTML = '<ul class="comps-list">' +
        unit.comps.map(c => {
          const isSection = /^(חלק|שלב|לפני הארוחה|אחרי הארוחה)/.test(c.trim());
          return `<li class="${isSection ? 'section' : ''}">${c}</li>`;
        }).join('') +
        '</ul>';
    } else {
      modalBody.innerHTML = '<p>לא נמצאו רכיבים ליחידה זו.</p>';
    }
  }
  overlay.classList.add('active');
}
document.getElementById('modalClose').addEventListener('click', () => overlay.classList.remove('active'));
overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.classList.remove('active'); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') overlay.classList.remove('active'); });
</script>

</body>
</html>
