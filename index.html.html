<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ספרית My Sequel Care</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.95;
        }

        /* ========== מסך ראשי - התחומים ========== */
        .main-screen {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .domain-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            border-left: 5px solid;
            text-align: center;
        }

        .domain-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        }

        .domain-card h2 {
            font-size: 1.5em;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .domain-card .count {
            display: inline-block;
            background: #f0f0f0;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            color: #666;
        }

        .domain-card:hover .count {
            background: #e0e0e0;
        }

        /* צבעים לתחומים */
        .domain-general { border-left-color: #1B4D7D; color: #1B4D7D; }
        .domain-general h2 { color: #1B4D7D; }

        .domain-disease { border-left-color: #4A90E2; color: #4A90E2; }
        .domain-disease h2 { color: #4A90E2; }

        .domain-daily { border-left-color: #FFD700; color: #333; }
        .domain-daily h2 { color: #FF9800; }

        .domain-healthy { border-left-color: #2ECC71; color: #2ECC71; }
        .domain-healthy h2 { color: #2ECC71; }

        .domain-communication { border-left-color: #8E44AD; color: #8E44AD; }
        .domain-communication h2 { color: #8E44AD; }

        .domain-employment { border-left-color: #E67E22; color: #E67E22; }
        .domain-employment h2 { color: #E67E22; }

        .domain-community { border-left-color: #C0392B; color: #C0392B; }
        .domain-community h2 { color: #C0392B; }

        /* ========== מסך היחידות ========== */
        .units-screen {
            display: none;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            color: #333;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .back-button:hover {
            background: #f5f5f5;
            transform: translateX(5px);
        }

        .domain-title {
            color: white;
            font-size: 2.2em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .units-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .unit-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .unit-card:hover {
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .unit-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .unit-name {
            font-size: 1.4em;
            font-weight: bold;
            color: #333;
            flex: 1;
        }

        .unit-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-explanation {
            background: #4A90E2;
            color: white;
        }

        .btn-explanation:hover {
            background: #357abd;
            transform: scale(1.05);
        }

        .btn-components {
            background: #2ECC71;
            color: white;
        }

        .btn-components:hover {
            background: #27ae60;
            transform: scale(1.05);
        }

        /* ========== מודל ההסבר ========== */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 40px;
            border-radius: 15px;
            width: 90%;
            max-width: 700px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }

        .modal-header h2 {
            font-size: 1.8em;
            color: #333;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 2em;
            cursor: pointer;
            color: #999;
            transition: color 0.3s ease;
        }

        .close-btn:hover {
            color: #333;
        }

        .modal-body {
            color: #555;
            line-height: 1.8;
            font-size: 1.05em;
        }

        .section-label {
            font-weight: bold;
            color: #333;
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-text {
            color: #555;
            margin-bottom: 15px;
            text-align: justify;
            line-height: 1.8;
        }

        .components-list {
            list-style: none;
            margin-bottom: 15px;
        }

        .components-list li {
            padding: 8px 15px;
            margin-bottom: 8px;
            background: #f9f9f9;
            border-right: 3px solid #4A90E2;
            border-radius: 4px;
            color: #555;
        }

        /* ========== רেספונסיבי ========== */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .domain-title {
                font-size: 1.6em;
            }

            .unit-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .unit-buttons {
                width: 100%;
            }

            .btn {
                flex: 1;
                justify-content: center;
            }

            .modal-content {
                width: 95%;
                padding: 25px;
                margin: 10% auto;
            }

            .main-screen {
                grid-template-columns: 1fr;
            }
        }

        /* ========== סקרול חלק ========== */
        html {
            scroll-behavior: smooth;
        }

        /* ========== אנימציות ========== */
        .fade-out {
            animation: fadeOut 0.3s ease;
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📖 ספרית My Sequel Care</h1>
        <p>כלים לשיקום והחלמה אישית</p>
    </div>

    <!-- ========== מסך ראשי ========== -->
    <div id="mainScreen" class="main-screen">
        <!-- יופיק דינמית על ידי JavaScript -->
    </div>

    <!-- ========== מסך היחידות ========== -->
    <div id="unitsScreen" class="units-screen">
        <button class="back-button" onclick="goBack()">← חזור לתחומים</button>
        <h1 class="domain-title" id="domainTitle"></h1>
        <div id="unitsList" class="units-list"></div>
    </div>
</div>

<!-- ========== מודל ההסבר ========== -->
<div id="explanationModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">הסבר</h2>
            <button class="close-btn" onclick="closeModal('explanationModal')">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<!-- ========== מודל הרכיבים ========== -->
<div id="componentsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="componentsTitle">רכיבי היחידה</h2>
            <button class="close-btn" onclick="closeModal('componentsModal')">&times;</button>
        </div>
        <div class="modal-body" id="componentsBody"></div>
    </div>
</div>

<script>
    // ========== נתונים ========== 
    const library = {

            {

                    {

                        explanation: 'מטרת היחידה היא לעזור למקבל השירות לזהות אילו קשרים מתאימים לו כרגע, מי האנשים שנמצאים סביבו ביומיום, ואילו צעדים קטנים יכולים לסייע לו להרגיש מחובר יותר לסביבה שבה הוא חי.',
                        components: [
                            'חלק א\'',
                            'שותפים לקהילה – יחסי שכנות ומשמעות (תוכן חינוכי)',
                            'שותפים לקהילה – תרגיל למיפוי קשרים בסביבה הקרובה',
                            'חלק ב\'',
                            'שותפים לקהילה – תרגיל מסכם - התבוננות ולמידה'
                        ]
                    },
                    {
                        name: 'שימוש בשירותי קהילה',
                        explanation: 'מטרת היחידה היא לתת כלים למקבל השירות לשימוש וצריכת שירותים יומיומיים שונים בקהילה.',
                        components: [
                            'חלק א\'',
                            'שימוש בשירותי קהילה (תוכן חינוכי)',
                            'שימוש בשירותי קהילה - תרגול',
                            'חלק ב\'',
                            'שימוש בשירותי קהילה - תרגיל - התבוננות וסיכום התהליך'
                        ]
                    },
                    {
                        name: 'הכרת המשאבים בסביבה הקרובה',
                        explanation: 'כלי זה מסייע לבחון את השתלבותו של האדם בקהילה, לזהות חוזקות וצרכים, ולבנות יחד מטרות וצעדים לקידום השתתפות ושייכות.',
                        components: [
                            'הכרת המשאבים בסביבה הקרובה (תוכן חינוכי)',
                            'הכרת המשאבים בסביבה הקרובה – תרגול'
                        ]
                    }
                ]
            }
        ]
    };

    // ========== פונקציות ========== 

    // 1. הצגת המסך הראשי (התחומים)
    function displayMainScreen() {
        const mainScreen = document.getElementById('mainScreen');
        mainScreen.innerHTML = '';

        library.domains.forEach(domain => {
            const card = document.createElement('div');
            card.className = `domain-card ${domain.color}`;
            card.innerHTML = `
                <h2>
                    <span class="domain-icon">${domain.icon}</span>
                    ${domain.name}
                </h2>
                <div class="count">${domain.units.length} יחידות</div>
            `;
            card.onclick = () => displayUnitsScreen(domain.id);
            mainScreen.appendChild(card);
        });

        document.getElementById('unitsScreen').style.display = 'none';
        mainScreen.style.display = 'grid';
    }

    // 2. הצגת מסך היחידות
    function displayUnitsScreen(domainId) {
        const domain = library.domains.find(d => d.id === domainId);
        if (!domain) return;

        document.getElementById('mainScreen').style.display = 'none';
        document.getElementById('unitsScreen').style.display = 'block';
        document.getElementById('domainTitle').textContent = domain.name;
        document.getElementById('domainTitle').style.color = 'white';

        const unitsList = document.getElementById('unitsList');
        unitsList.innerHTML = '';

        domain.units.forEach((unit, index) => {
            const card = document.createElement('div');
            card.className = 'unit-card';
            card.innerHTML = `
                <div class="unit-header">
                    <h3 class="unit-name">${index + 1}. ${unit.name}</h3>
                    <div class="unit-buttons">
                        <button class="btn btn-explanation" onclick="showExplanation('${unit.name}', '${unit.explanation.replace(/'/g, "\\'")}')">
                            📖 הסבר
                        </button>
                        <button class="btn btn-components" onclick="showComponents('${unit.name}', ${JSON.stringify(unit.components).replace(/"/g, '&quot;')})">
                            📋 רכיבים
                        </button>
                    </div>
                </div>
            `;
            unitsList.appendChild(card);
        });

        window.scrollTo(0, 0);
    }

    // 3. הצגת ההסבר
    function showExplanation(unitName, explanation) {
        document.getElementById('modalTitle').textContent = `הסבר: ${unitName}`;
        document.getElementById('modalBody').innerHTML = `
            <div class="section-text">${explanation}</div>
        `;
        document.getElementById('explanationModal').style.display = 'block';
    }

    // 4. הצגת הרכיבים
    function showComponents(unitName, components) {
        document.getElementById('componentsTitle').textContent = `רכיבי היחידה: ${unitName}`;
        
        let html = '<ul class="components-list">';
        components.forEach(component => {
            html += `<li>${component}</li>`;
        });
        html += '</ul>';
        
        document.getElementById('componentsBody').innerHTML = html;
        document.getElementById('componentsModal').style.display = 'block';
    }

    // 5. סגירת המודל
    function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }

    // 6. חזרה לעמוד הראשי
    function goBack() {
        displayMainScreen();
    }

    // 7. סגירת מודל בלחיצה על רקע
    window.onclick = function(event) {
        const explanationModal = document.getElementById('explanationModal');
        const componentsModal = document.getElementById('componentsModal');
        
        if (event.target == explanationModal) {
            explanationModal.style.display = 'none';
        }
        if (event.target == componentsModal) {
            componentsModal.style.display = 'none';
        }
    }

    // 8. טעינה ראשונית
    displayMainScreen();

</script>
